swagger: "2.0"
info:
  title: Briefing-Werkstatt
  description: >-
    Mechanische Schritte des Firmenbriefings: Ablage, Formatprüfung, Prüfpakete,
    Freigabe und Rendering. Nutzt die vorhandenen Skripte unter scripts/.
  version: "0.1.0"
# Platzhalter: beim Anlegen des Custom Connectors durch die echte Adresse ersetzen.
host: WERKSTATT-HOST.azurewebsites.net
basePath: /api
schemes:
  - https
consumes:
  - application/json
produces:
  - application/json
securityDefinitions:
  funktionsschluessel:
    type: apiKey
    in: header
    name: x-functions-key
security:
  - funktionsschluessel: []

definitions:
  Lauf:
    type: object
    required: [run_id]
    properties:
      run_id: {type: string}
  Ergebnis:
    type: object
    description: JSON-Ergebnis eines Agenten, unverändert durchgereicht.
    additionalProperties: true
  Status:
    type: object
    properties:
      ok: {type: boolean}
      fehler:
        type: array
        items: {type: string}
  Dokument:
    type: object
    properties:
      dokument:
        type: string
        description: Eingabedokument für den nächsten Agentenaufruf.
  Rueckgabe:
    type: object
    description: Befunde gruppiert nach zuständigem Modul (owner).
    additionalProperties:
      type: array
      items:
        type: object
        additionalProperties: true

paths:
  /laufAnlegen:
    post:
      operationId: laufAnlegen
      summary: Neuen Briefinglauf anlegen
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [anfrage, modus]
            properties:
              anfrage: {type: string}
              modus: {type: string, enum: [voll, kurz]}
      responses:
        "200":
          description: Lauf angelegt
          schema:
            type: object
            properties:
              run_id: {type: string}
              stichtag: {type: string, format: date}

  /auftragSpeichern:
    post:
      operationId: auftragSpeichern
      summary: Auftrag, Manifest und Vergleichsplan speichern und prüfen
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [run_id, ergebnis]
            properties:
              run_id: {type: string}
              ergebnis: {$ref: "#/definitions/Ergebnis"}
      responses:
        "200":
          description: Prüfergebnis
          schema:
            type: object
            properties:
              ok: {type: boolean}
              fehler: {type: array, items: {type: string}}
              rollen: {type: array, items: {type: string}}
              fokus:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: string}
                    label: {type: string}

  /eingabeHolen:
    post:
      operationId: eingabeHolen
      summary: Eingabedokument für einen Faktenagenten erzeugen
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [run_id, rolle]
            properties:
              run_id: {type: string}
              rolle: {type: string, description: "context, portfolio, cluster, market oder focus:<id>"}
              rueckgabe: {$ref: "#/definitions/Ergebnis"}
      responses:
        "200":
          description: Eingabedokument
          schema: {$ref: "#/definitions/Dokument"}

  /quelleAbrufen:
    post:
      operationId: quelleAbrufen
      summary: Öffentliche Quelle laden, im Lauf speichern und Text liefern
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [run_id, url]
            properties:
              run_id: {type: string}
              url: {type: string}
              seite: {type: integer, description: "Abschnitt des Textes bei langen Dokumenten"}
      responses:
        "200":
          description: Quelle
          schema:
            type: object
            properties:
              source_id: {type: string}
              url: {type: string}
              title: {type: string}
              accessed_date: {type: string, format: date}
              text: {type: string}
              weitere_seiten: {type: boolean}

  /modulSpeichern:
    post:
      operationId: modulSpeichern
      summary: Ergebnis eines Faktenagenten speichern und Format prüfen
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [run_id, rolle, ergebnis]
            properties:
              run_id: {type: string}
              rolle: {type: string}
              ergebnis: {$ref: "#/definitions/Ergebnis"}
      responses:
        "200":
          description: Prüfergebnis
          schema: {$ref: "#/definitions/Status"}

  /pruefungVorbereiten:
    post:
      operationId: pruefungVorbereiten
      summary: Prüfpaket bauen und Quellen auf bis zu drei Dokumentprüfungen verteilen
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [run_id, phase]
            properties:
              run_id: {type: string}
              phase: {type: string, enum: [basis, final]}
      responses:
        "200":
          description: Formatfehler je Modul oder Prüfjobs
          schema:
            type: object
            properties:
              formatfehler: {$ref: "#/definitions/Rueckgabe"}
              jobs:
                type: array
                items:
                  type: object
                  properties:
                    job_id: {type: string}
                    dokument: {type: string}

  /befundSpeichern:
    post:
      operationId: befundSpeichern
      summary: Befunde einer Dokumentprüfung speichern
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [run_id, phase, job_id, ergebnis]
            properties:
              run_id: {type: string}
              phase: {type: string, enum: [basis, final]}
              job_id: {type: string}
              ergebnis: {$ref: "#/definitions/Ergebnis"}
      responses:
        "200":
          description: Prüfergebnis
          schema: {$ref: "#/definitions/Status"}

  /leitpruefungEingabe:
    post:
      operationId: leitpruefungEingabe
      summary: Dokumentbefunde einsammeln und Eingabe für die Leitprüfung erzeugen
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [run_id, phase]
            properties:
              run_id: {type: string}
              phase: {type: string, enum: [basis, final]}
      responses:
        "200":
          description: Eingabedokument
          schema: {$ref: "#/definitions/Dokument"}

  /pruefungAbschliessen:
    post:
      operationId: pruefungAbschliessen
      summary: Leitentscheidungen zusammenführen, Freigaberegeln anwenden
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [run_id, phase, ergebnis]
            properties:
              run_id: {type: string}
              phase: {type: string, enum: [basis, final]}
              ergebnis: {$ref: "#/definitions/Ergebnis"}
      responses:
        "200":
          description: Prüftor
          schema:
            type: object
            properties:
              bestanden: {type: boolean}
              rueckgabe: {$ref: "#/definitions/Rueckgabe"}
              fehler: {type: array, items: {type: string}}

  /bewertungEingabe:
    post:
      operationId: bewertungEingabe
      summary: Bewertungskontext für Positionierung oder SWOT erzeugen
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [run_id, schritt]
            properties:
              run_id: {type: string}
              schritt: {type: string, enum: [positioning, swot]}
              rueckgabe: {$ref: "#/definitions/Ergebnis"}
      responses:
        "200":
          description: Eingabedokument
          schema: {$ref: "#/definitions/Dokument"}

  /bewertungSpeichern:
    post:
      operationId: bewertungSpeichern
      summary: Positionierung oder SWOT speichern und prüfen
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [run_id, schritt, ergebnis]
            properties:
              run_id: {type: string}
              schritt: {type: string, enum: [positioning, swot]}
              ergebnis: {$ref: "#/definitions/Ergebnis"}
      responses:
        "200":
          description: Prüfergebnis
          schema:
            type: object
            properties:
              ok: {type: boolean}
              fehler: {type: array, items: {type: string}}
              rueckfragen: {$ref: "#/definitions/Rueckgabe"}

  /briefingRendern:
    post:
      operationId: briefingRendern
      summary: Freigegebenes Briefing als HTML erzeugen
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required: [run_id, modus]
            properties:
              run_id: {type: string}
              modus: {type: string, enum: [voll, kurz]}
      responses:
        "200":
          description: HTML-Datei
          schema:
            type: object
            properties:
              dateiname: {type: string}
              html: {type: string}

  /laufArchiv:
    post:
      operationId: laufArchiv
      summary: Gesamten Lauf als ZIP liefern
      parameters:
        - in: body
          name: body
          required: true
          schema: {$ref: "#/definitions/Lauf"}
      responses:
        "200":
          description: ZIP als Base64
          schema:
            type: object
            properties:
              dateiname: {type: string}
              zip_base64: {type: string}
