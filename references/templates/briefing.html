<dialog class="es-dialog" id="es-dialog" aria-labelledby="es-dialog-title"><div class="es-dialog-head"><h3 id="es-dialog-title"></h3><button type="button" class="es-dialog-close" aria-label="Details schließen">×</button></div><div class="es-dialog-body"></div></dialog>
<script>
(()=>{
 const pages=[...document.querySelectorAll('.page')],tabs=[...document.querySelectorAll('[data-page]')];
 function show(id){pages.forEach(p=>p.hidden=p.id!==id);tabs.forEach(t=>(t.setAttribute('aria-selected',String(t.dataset.page===id)),t.tabIndex=t.dataset.page===id?0:-1));}
 function reveal(hash,scroll=true){if(!hash)return;let id;try{id=decodeURIComponent(hash.slice(1));}catch{return;}const node=document.getElementById(id);if(!node)return;const page=node.closest('.page');if(page)show(page.id);if(page?.id==='page-sources'){const search=document.getElementById('source-search-input');search.value='';document.querySelectorAll('#page-sources .claim-detail').forEach(n=>n.hidden=false);}for(let p=node;p;p=p.parentElement)if(p.tagName==='DETAILS')p.open=true;if(scroll)node.scrollIntoView({block:'start'});}
 tabs.forEach(t=>t.addEventListener('click',()=>{show(t.dataset.page);window.scrollTo({top:0,behavior:'instant'});}));show(pages[0].id);
 document.addEventListener('click',e=>{const link=e.target.closest('a[href^="#"]');if(link)reveal(link.getAttribute('href'));});
 window.addEventListener('hashchange',()=>reveal(location.hash));reveal(location.hash);
 let printState=null;
 window.addEventListener('beforeprint',()=>{if(printState)return;printState={pages:pages.map(p=>p.hidden),details:[...document.querySelectorAll('details')].map(d=>[d,d.open])};pages.forEach(p=>p.hidden=false);printState.details.forEach(([d])=>d.open=true);});
 window.addEventListener('afterprint',()=>{if(!printState)return;pages.forEach((p,i)=>p.hidden=printState.pages[i]);printState.details.forEach(([d,open])=>d.open=open);printState=null;});
})();
(()=>{
 const dialog=document.getElementById('es-dialog');
 if(!dialog||typeof dialog.showModal!=='function')return;
 const title=dialog.querySelector('#es-dialog-title'),body=dialog.querySelector('.es-dialog-body');
 document.addEventListener('click',e=>{
  const summary=e.target.closest('.es-entry>summary,.card>summary');
  if(summary&&!summary.closest('dialog')){e.preventDefault();const entry=summary.parentElement;title.textContent=entry.dataset.esTitle;body.replaceChildren(entry.querySelector('.es-detail').cloneNode(true));dialog.showModal();return;}
  const cell=e.target.closest('a.cell');if(cell&&!cell.closest('dialog')){e.preventDefault();e.stopPropagation();title.textContent=cell.dataset.esTitle;body.replaceChildren(cell.nextElementSibling.content.cloneNode(true));dialog.showModal();return;}
  if(e.target.closest('a[href^="#"]')){if(dialog.open)dialog.close();}
 },true);
 dialog.querySelector('.es-dialog-close').addEventListener('click',()=>dialog.close());
 dialog.addEventListener('click',e=>{if(e.target!==dialog)return;const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close();});
 dialog.addEventListener('close',()=>body.replaceChildren());
 window.addEventListener('beforeprint',()=>{if(dialog.open)dialog.close();});
})();

(()=>{
 const input=document.getElementById('source-search-input');
 input?.addEventListener('input',()=>{const q=input.value.trim().toLocaleLowerCase();document.querySelectorAll('#page-sources .claim-detail').forEach(row=>row.hidden=Boolean(q&&!row.textContent.toLocaleLowerCase().includes(q)));});
 const tabs=document.querySelector('.tabs');tabs.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;const buttons=[...tabs.querySelectorAll('button')],i=buttons.indexOf(document.activeElement);if(i<0)return;e.preventDefault();const n=e.key==='Home'?0:e.key==='End'?buttons.length-1:(i+(e.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length;buttons[n].click();buttons[n].focus();});
})();
</script></body></html>
