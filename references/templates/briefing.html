<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__ · Firmenbriefing</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:85px}body{margin:0;background:#eef2f5;color:#193445;font:15px/1.55 Arial,Helvetica,sans-serif}a{color:#154c61;text-underline-offset:3px}button,input,select{font:inherit}button,summary{cursor:pointer}a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid #c3872d;outline-offset:3px}[hidden]{display:none!important}.mast{background:#132d40;color:#fff}.mast>div{max-width:1520px;margin:auto;padding:25px 32px}.mast h1{margin:4px 0;font-size:30px}.mast p{margin:5px 0}.badge{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:#e7c690}.tabs{position:sticky;top:0;background:white;border-bottom:1px solid #cfdce2;padding:10px 24px;z-index:3;display:flex;gap:8px;overflow:auto}.tabs button{background:#f0f5f7;border:1px solid #d6e1e6;border-radius:7px;padding:9px 16px;color:#154c61;white-space:nowrap}.tabs button[aria-selected="true"]{background:#154c61;color:#fff}main{max-width:1520px;margin:auto;padding:22px 28px}.module{background:white;border:1px solid #dbe4e8;border-radius:12px;padding:20px 24px;margin:0 0 20px;box-shadow:0 3px 10px #19344505}.module h2{font-size:21px;margin:0 0 14px;padding-bottom:9px;border-bottom:2px solid #dce8eb}.module h3{font-size:17px;margin:8px 0}.module h4{font-size:15px}p{margin:8px 0}.meta,small{color:#607887;font-size:12px}small{display:block}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:12px}.card{background:#f7fafb;border:1px solid #dbe7eb;border-radius:9px;padding:12px 15px;align-self:start}.card summary{font-weight:600}.card[open]{border-left:3px solid #c3872d}.card p{margin:10px 0}.claim{display:inline-block;margin:3px 4px 3px 0;padding:2px 7px;border-radius:5px;background:#e6eff2;font-size:12px}.claim-detail{border:1px solid #dbe5e9;border-radius:7px;padding:12px;margin:10px 0;scroll-margin-top:85px}.claim-detail summary{font-weight:600}.claim-detail:target{border-left:4px solid #c3872d}.table-wrap{overflow-x:auto;border:1px solid #dbe5e9;border-radius:8px;margin:12px 0}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;vertical-align:top;padding:12px;border-bottom:1px solid #dce7eb;min-width:150px}th{background:#eef4f6}tbody tr:last-child td{border-bottom:0}.cell{display:block;text-decoration:none;padding:7px;background:#f4f8f9;border-radius:6px}.cell:hover{background:#e6eef1}.steps{display:flex;gap:4px;margin-top:8px}.steps i{display:block;width:20px;height:7px;background:#dbe3e8;border-radius:2px}.steps .on{background:#154c61}.timeline{border-left:2px solid #d3e2e8;padding-left:18px}.event{display:grid;grid-template-columns:125px 1fr;gap:14px;margin-bottom:12px}time{font-weight:600;color:#154c61;padding-top:12px}.swot{display:grid;grid-template-columns:1fr 1fr;gap:14px}.quadrant{border:1px solid #dce6ea;padding:14px;border-radius:9px;background:#fbfcfd}.quadrant .card{margin:8px 0}.note{display:grid;grid-template-columns:minmax(110px,180px) 1fr;gap:4px 12px;border-bottom:1px solid #e1e9ed;padding:10px 0}.note dt{font-weight:600;font-size:12px;color:#607887}.note dd{margin:0}.evidence{padding-left:22px}.evidence li{padding:8px 0;overflow-wrap:anywhere}.module>details{margin-top:12px}.module>details>summary{font-weight:600;color:#154c61}footer{max-width:1520px;margin:0 auto;padding:0 30px 25px;color:#607887;font-size:12px}body #briefing-company-network{color-scheme:light;--cn-bg:#fff;--cn-target:#154c61;--cn-soft:#f3f7f9;--cn-fg:#193445}.page{overflow-wrap:anywhere}
@media(max-width:760px){main{padding:14px 10px}.mast>div{padding:20px 18px}.mast h1{font-size:24px}.tabs{padding:8px 10px}.module{padding:15px}.swot{grid-template-columns:1fr}.event{grid-template-columns:1fr;gap:4px}.note{grid-template-columns:1fr}.note dd{margin-bottom:7px}}
@media print{body{background:white;font-size:10pt}.tabs{display:none}.mast>div{padding:10px 0}.mast{background:white;color:#193445}main{padding:0;max-width:none}.page[hidden]{display:block!important}.module{box-shadow:none;padding:10px 0;border:0;border-bottom:1px solid #ddd;break-inside:auto}.card,.claim-detail{break-inside:avoid}.swot{display:block}.table-wrap{overflow:visible}td,th{min-width:0}#briefing-company-network .cn-table{display:block}#briefing-company-network .cn-table-wrap{overflow:visible}a{overflow-wrap:anywhere}}
</style></head><body><header class="mast"><div><div class="badge">__BADGE__</div><h1>__TITLE__</h1><p>__SCOPE__</p><p>Stand __DATE__</p></div></header><nav class="tabs" aria-label="Briefing-Seiten">__TABS__</nav><main>__CONTENT__</main><footer>Fakten und Analysteninterpretation getrennt · Details und Belegstellen per Klick · Quellenstand des jeweiligen Laufs</footer>
<script>
(()=>{
 const pages=[...document.querySelectorAll('.page')],tabs=[...document.querySelectorAll('[data-page]')];
 function show(id){pages.forEach(p=>p.hidden=p.id!==id);tabs.forEach(t=>t.setAttribute('aria-selected',String(t.dataset.page===id)));}
 function reveal(hash,scroll=true){if(!hash)return;let id;try{id=decodeURIComponent(hash.slice(1));}catch{return;}const node=document.getElementById(id);if(!node)return;const page=node.closest('.page');if(page)show(page.id);for(let p=node;p;p=p.parentElement)if(p.tagName==='DETAILS')p.open=true;if(scroll)node.scrollIntoView({block:'start'});}
 tabs.forEach(t=>t.addEventListener('click',()=>show(t.dataset.page)));show(pages[0].id);
 document.addEventListener('click',e=>{const link=e.target.closest('a[href^="#"]');if(link)reveal(link.getAttribute('href'));});
 window.addEventListener('hashchange',()=>reveal(location.hash));reveal(location.hash);
 let printState=null;
 window.addEventListener('beforeprint',()=>{if(printState)return;printState={pages:pages.map(p=>p.hidden),details:[...document.querySelectorAll('details')].map(d=>[d,d.open])};pages.forEach(p=>p.hidden=false);printState.details.forEach(([d])=>d.open=true);});
 window.addEventListener('afterprint',()=>{if(!printState)return;pages.forEach((p,i)=>p.hidden=printState.pages[i]);printState.details.forEach(([d,open])=>d.open=open);printState=null;});
})();
</script></body></html>
